<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Masuk | Go For Al-Qur'an

</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;

background:#f8fafc;

min-height:100vh;

display:flex;

justify-content:center;
align-items:center;

padding:40px;
}

.container{

max-width:1100px;
width:100%;

display:grid;
grid-template-columns:1fr 1fr;

gap:70px;

align-items:center;
}

.left h1{

font-size:58px;

line-height:1.2;

margin-bottom:25px;

color:#1E293B;
}

.left p{

font-size:18px;

line-height:1.9;

color:#64748B;
}

.badge{

display:inline-block;

background:#eef7f8;

color:#0F4C5C;

padding:10px 18px;

border-radius:999px;

margin-bottom:25px;

font-weight:600;
}

.form-card{

background:white;

padding:50px;

border-radius:35px;

box-shadow:
0 20px 60px rgba(0,0,0,.08);

}

.form-card h2{

margin-bottom:35px;

color:#1E293B;
}

.input-group{

margin-bottom:22px;
}

.input-group label{

display:block;

margin-bottom:10px;

font-weight:600;

color:#1E293B;
}

.input-group input{

width:100%;

padding:17px 18px;

border:1px solid #ddd;

border-radius:15px;

font-size:15px;

outline:none;
}

.input-group input:focus{

border-color:#0F4C5C;
}

.options{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

font-size:14px;
}

.options a{

text-decoration:none;

color:#0F4C5C;

font-weight:600;
}

.btn{

width:100%;

padding:18px;

border:none;

background:#0F4C5C;

color:white;

font-size:17px;

font-weight:700;

border-radius:18px;

cursor:pointer;

transition:.3s;
}

.btn:hover{

transform:translateY(-3px);
}

.bottom{

margin-top:30px;

text-align:center;

color:#64748B;
}

.bottom a{

color:#0F4C5C;

font-weight:600;

text-decoration:none;
}

@media(max-width:900px){

.container{

grid-template-columns:1fr;
}

.left{

text-align:center;
}

.left h1{

font-size:42px;
}

}

</style>

</head>

<body>


<div class="container">


<div class="left">

<div class="badge">

📖 Go For Al-Qur'an

</div>

<h1>

Selamat Datang Kembali

</h1>

<p>

Masuk ke akun Anda untuk melanjutkan perjalanan bersama Al-Qur'an.

<br><br>

Belajar • Paham • Amalkan

</p>

</div>



<div class="form-card">

<h2>

Masuk ke Akun

</h2>

<form>


<div class="input-group">

<label>

Email

</label>

<input
type="email"
placeholder="email@gmail.com">

</div>



<div class="input-group">

<label>

Password

</label>

<input
type="password"
placeholder="********">

</div>


<div class="options">

<label>

<input type="checkbox">

 Ingat saya

</label>

<a href="#">

Lupa password?

</a>

</div>


<button class="btn">

Masuk

</button>


</form>


<div class="bottom">

Belum memiliki akun?

<a href="register.html">

Daftar sekarang

</a>

</div>


</div>


</div>

</body>

</html>
